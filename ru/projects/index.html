  <script>
    (function() {
      var STORAGE_KEY = 'vf_desktop_menu_open';

      function isDesktop() { return window.innerWidth > 768; }

      function initNav() {
        var burger = document.getElementById('navBurger');
        var menu = document.getElementById('mobileMenu');
        var overlay = document.getElementById('mobileMenuOverlay');
        var closeBtn = document.getElementById('mobileMenuClose');
        var desktopDropdown = document.getElementById('desktopDropdown');

        function openMobileMenu() {
          menu.classList.add('is-open');
          overlay.classList.add('is-visible');
          burger.setAttribute('aria-expanded', 'true');
          menu.setAttribute('aria-hidden', 'false');
          document.body.classList.add('menu-open');
          burger.classList.add('is-active');
          // Mobile uses a full-screen overlay, not the desktop dropdown —
          // make sure the lang-toggle never carries a leftover desktop shift.
          var langToggle = document.querySelector('.lang-toggle');
          if (langToggle) langToggle.style.transform = '';
        }

        function closeMobileMenu() {
          menu.classList.remove('is-open');
          overlay.classList.remove('is-visible');
          burger.setAttribute('aria-expanded', 'false');
          menu.setAttribute('aria-hidden', 'true');
          document.body.classList.remove('menu-open');
          burger.classList.remove('is-active');
        }

        function shiftLangToggle(open) {
          var langToggle = document.querySelector('.lang-toggle');
          if (!langToggle) return;
          if (open) {
            var dropRect = desktopDropdown.getBoundingClientRect();
            var toggleRect = langToggle.getBoundingClientRect();
            var overlap = toggleRect.right - dropRect.left;
            langToggle.style.transform = overlap > 0
              ? 'translateX(-' + (overlap + 12) + 'px)'
              : '';
          } else {
            langToggle.style.transform = '';
          }
        }

        function openDesktopMenu() {
          desktopDropdown.classList.add('is-open');
          desktopDropdown.setAttribute('aria-hidden', 'false');
          burger.classList.add('is-active');
          // Defer the layout read (getBoundingClientRect in shiftLangToggle)
          // to the next frame so it doesn't force a synchronous reflow right
          // after the class-add style write above.
          requestAnimationFrame(function() { shiftLangToggle(true); });
          try { sessionStorage.setItem(STORAGE_KEY, '1'); } catch(e) {}
        }

        function closeDesktopMenu() {
          desktopDropdown.classList.remove('is-open');
          desktopDropdown.setAttribute('aria-hidden', 'true');
          burger.classList.remove('is-active');
          shiftLangToggle(false);
          document.documentElement.classList.remove('desktop-menu-was-open');
          try { sessionStorage.removeItem(STORAGE_KEY); } catch(e) {}
        }

        // Restore desktop menu state
        if (isDesktop()) {
          try {
            if (sessionStorage.getItem(STORAGE_KEY) === '1') {
              openDesktopMenu();
            }
          } catch(e) {}
        }

        burger.addEventListener('click', function(e) {
          e.stopPropagation();
          if (isDesktop()) {
            desktopDropdown.classList.contains('is-open') ? closeDesktopMenu() : openDesktopMenu();
          } else {
            menu.classList.contains('is-open') ? closeMobileMenu() : openMobileMenu();
          }
        });

        if (closeBtn) closeBtn.addEventListener('click', closeMobileMenu);
        if (overlay) overlay.addEventListener('click', closeMobileMenu);

        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            closeDesktopMenu();
            closeMobileMenu();
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initNav);
      } else {
        initNav();
      }
    })();
  </script>
