  html,body{margin:0;height:100%;overflow:hidden;background:#040909;color:#e9efe9;}
  #app{position:fixed;inset:0;}
  canvas{display:block;touch-action:none;}
  #leaders{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}
  #leaders polyline{fill:none;stroke:#cfe9e5;stroke-width:.6;}
  #leaders circle{fill:#bff3ec;}
  #labels{position:fixed;inset:0;pointer-events:none;}
  .lbl{position:absolute;left:0;top:0;white-space:nowrap;font:500 15px/1 Cormorant,Georgia,serif;letter-spacing:.2em;text-transform:uppercase;
       color:#e8f1ee;text-shadow:0 0 18px rgba(0,0,0,.6);transition:color .3s,letter-spacing .4s;will-change:transform,opacity;}
  .lbl.hot{color:#9ff5ea;letter-spacing:.24em;}
  .brand{position:fixed;left:44px;top:38px;pointer-events:none;}
  .brand .over{font:600 11px/1 "Segoe UI",Arial,sans-serif;letter-spacing:.42em;text-transform:uppercase;color:#6fb9b1;margin-bottom:14px;}
  .brand h1{margin:0;font:500 30px/1.12 Cormorant,Georgia,serif;letter-spacing:.02em;color:#f2f6f2;max-width:440px;}
  .brand h1 i{font-style:normal;color:#8fe0d6;}
  .rule{width:46px;height:1px;background:#4aa59c;margin:18px 0 0;}
  .hint{position:fixed;left:44px;bottom:38px;font:500 11px/1.9 "Segoe UI",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7f9c99;pointer-events:none;}
  .hint b{color:#cfe7e3;font-weight:600;}
  .ctrl{position:fixed;right:44px;bottom:36px;display:flex;gap:10px;}
  .ctrl button{font:600 11px/1 "Segoe UI",Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#d9ebe8;background:rgba(10,30,30,.35);
       border:1px solid rgba(143,224,214,.28);padding:13px 20px;cursor:pointer;backdrop-filter:blur(8px);transition:all .25s;}
  .ctrl button:hover{border-color:#8fe0d6;color:#fff;background:rgba(20,70,66,.45);}
  .ctrl button.on{background:rgba(143,224,214,.16);border-color:#8fe0d6;color:#fff;}
  #restore{display:none;}
  #restore.show{display:block;border-color:#8fe0d6;animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(143,224,214,.08);}}
  body.clean .brand,body.clean .hint,body.clean .ctrl{opacity:0;pointer-events:none;}
  .brand,.hint,.ctrl{transition:opacity .4s;}
  @media (max-width:760px){.brand{left:20px;top:22px}.brand h1{font-size:22px}.hint{display:none}.ctrl{right:16px;bottom:16px}.lbl{font-size:11px}}
</style>
</head>
<body>
<div id="app"></div>
<svg id="leaders"></svg>
<div id="labels"></div>
<div class="brand">
  <div class="over">Тенсегрити</div>
  <h1>Структурно-динамическая модель <i>профессиональной идентичности</i></h1>
  <div class="rule"></div>
</div>
<div class="hint"><b>Тяните</b> узел или стержень — отпустите с размаху<br><b>Двойной клик</b> по тросу — разорвать связь<br>Фон — вращение · колесо — масштаб · S — звезда · H — скрыть · L — подписи · F — экран</div>
<div class="ctrl">
  <button id="restore">Восстановить связи</button>
  <button id="star">Звезда</button>
